name: Bug report
description: Something behaves differently from what the README says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Before you paste anything:** never include keychain material,
        provisioning profiles, app binaries, or device logs carrying personal
        data. Redact host-specific paths. If this looks like a security
        problem, report it privately instead — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `doctor`
      description: >
        Run `apple-debug-mcp doctor` and paste it with host-specific paths
        redacted. It reports the helper binaries, the daemon state, and the
        launchd registration — which is usually where the answer is.
      render: text

  - type: input
    id: version
    attributes:
      label: Version
      description: "`apple-debug-mcp --version`, and your Node version."
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How it is installed
      options:
        - npm global install
        - npx
        - Cloned from source
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: macOS and Xcode versions
      description: "`sw_vers -productVersion` and `xcodebuild -version`."
    validations:
      required: true
