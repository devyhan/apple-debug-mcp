name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # Weekly drift check against latest simslim/axe/Xcode (Monday 02:23 UTC).
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines; 22 and 24 are the
        # active LTS lines.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      # The suite runs ONCE, here: an earlier shape ran `npm test` and then
      # re-ran vitest inside the guard, so a flaky test could pass the first
      # run and fail the second. The exit code is captured explicitly because
      # `out=$(...)` under the runner's `set -e` would otherwise die silently
      # on a test failure. The suite is 20 files and 289 tests, so anything
      # below 20 files or 250 tests means something stopped being discovered.
      - name: Run tests and assert the full suite ran
        shell: bash
        run: |
          set +e
          out=$(npx vitest run 2>&1)
          code=$?
          set -e
          echo "$out" | tail -n 8
          clean=$(echo "$out" | sed $'s/\x1b\\[[0-9;]*[A-Za-z]//g')
          files=$(echo "$clean" | grep -E 'Test Files' | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' | head -n1 || true)
          count=$(echo "$clean" | grep -E '^\s*Tests ' | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' | head -n1 || true)
          echo "test files passed: ${files:-?}"
          echo "tests passed: ${count:-?}"
          if [ "$code" -ne 0 ]; then
            echo "::error::vitest exited $code"
            exit 1
          fi
          if [ "${files:-0}" -lt 20 ]; then
            echo "::error::Only ${files:-0} test files passed; the suite should be 20."
            exit 1
          fi
          if [ "${count:-0}" -lt 250 ]; then
            echo "::error::Only ${count:-0} tests passed; the suite should be 250+."
            echo "A runner that silently matches fewer files than it should is the"
            echo "failure here."
            exit 1
          fi

      - run: npm run build

  package:
    name: Package installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # dist/ is gitignored, so this proves `prepack` rebuilds it. Without that
      # script a publish from a clean checkout ships a tarball with no code and
      # npm reports success.
      - name: Pack from a clean checkout
        run: |
          npm pack --silent | tail -1 > /tmp/tgz
          echo "tarball: $(cat /tmp/tgz)"
          tar -tzf "$(cat /tmp/tgz)" | wc -l | xargs -I{} echo "files in tarball: {}"
          if [ "$(tar -tzf "$(cat /tmp/tgz)" | wc -l)" -lt 50 ]; then
            echo "::error::Tarball is nearly empty — prepack did not build."
            exit 1
          fi
          tar -tzf "$(cat /tmp/tgz)" | grep -q 'package/LICENSE' || {
            echo "::error::LICENSE is missing from the tarball."; exit 1; }
          tar -tzf "$(cat /tmp/tgz)" | grep -q 'package/README.md' || {
            echo "::error::README.md is missing from the tarball."; exit 1; }

      - name: Install the tarball and run it
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install --silent "$GITHUB_WORKSPACE/$(cat /tmp/tgz)"
          ./node_modules/.bin/apple-debug-mcp --version
          ./node_modules/.bin/apple-debug-mcp --help | head -1

      # The daemon speaks Streamable HTTP with a /health probe: boot it the way
      # the launchd plist would and check the probe answers with this version.
      # simslim/axe are stubbed — the daemon only runs `simslim version` and
      # `axe --version` at boot, and neither exists on Linux.
      - name: Boot it and check /health the way launchd would
        run: |
          cd /tmp/consumer
          mkdir -p /tmp/stubbin
          printf '#!/bin/sh\necho "stub 0.0.0"\n' > /tmp/stubbin/simslim
          printf '#!/bin/sh\necho "stub 0.0.0"\n' > /tmp/stubbin/axe
          chmod +x /tmp/stubbin/simslim /tmp/stubbin/axe
          export PATH="/tmp/stubbin:$PATH"
          export SIMSLIM_BIN=/tmp/stubbin/simslim AXE_BIN=/tmp/stubbin/axe
          export SIM_MCP_PORT=3210 SIM_MCP_STATE_FILE=/tmp/consumer/health-state.json
          ./node_modules/.bin/apple-debug-mcp > /tmp/consumer/daemon.log 2>&1 &
          DAEMON=$!
          trap 'kill $DAEMON 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3210/health > /tmp/consumer/health.json; then break; fi
            sleep 1
          done
          cat /tmp/consumer/health.json
          export EXPECTED="$(node -p 'require(process.env.GITHUB_WORKSPACE + "/package.json").version')"
          node -e '
            const h = require("/tmp/consumer/health.json");
            const expected = process.env.EXPECTED;
            console.log("ok:", h.ok, "version:", h.version, "expected:", expected);
            if (h.ok !== true) { console.error("::error::/health did not report ok:true"); process.exit(1); }
            if (h.version !== expected) { console.error(`::error::/health version ${h.version} != package.json ${expected}`); process.exit(1); }
          '

  smoke-macos:
    name: macOS simulator smoke
    # macOS minutes cost ~10x Linux: run on main pushes, the weekly schedule,
    # manual dispatch, or PRs explicitly labeled `run-smoke`.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-smoke')
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Select newest Xcode
        run: |
          ls /Applications | grep -i xcode || true
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST/Contents/Developer"; fi
          xcode-select -p
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Install simslim and axe
        run: |
          brew install mobai-app/tap/simslim
          brew install cameroncooke/axe/axe
          simslim version
          axe --version
      - name: Install serve-sim
        run: npm install -g serve-sim
      # A cold simulator boot takes longer than the MCP request timeout, so a
      # Shutdown target makes lease_acquire fail with -32001. Pre-boot one
      # matching device here (same filter as smoke.mjs SMOKE_DEVICE_SUBSTR);
      # the smoke test prefers Booted devices and picks this one up.
      - name: Pre-boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e '
            let data = "";
            process.stdin.on("data", (c) => (data += c)).on("end", () => {
              const substr = (process.env.SMOKE_DEVICE_SUBSTR ?? "iphone").toLowerCase();
              const devices = Object.values(JSON.parse(data).devices ?? {}).flat();
              const match = devices.find((d) => d.isAvailable !== false && d.name.toLowerCase().includes(substr));
              if (!match) { console.error("no available simulator matching " + substr); process.exit(1); }
              console.log(match.udid);
            });
          ')
          echo "Pre-booting $UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Smoke test (real simulator)
        run: npm run smoke
